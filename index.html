<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>START Scholar Portal</title>
<meta name="description" content="Weekly check-ins, your school and START events for DOST-SEI START scholars.">
<meta name="theme-color" content="#0099FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="START">
<link rel="manifest" href="manifest.webmanifest?v=11">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=11">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same look as the START website: the blue-to-yellow wash, big white rounded cards, the star, pill buttons */
  :root { --navy: #12203A; --navy2: #23365C; --blue: #0099FF; --sky: #7CCBFF; --sun: #FFDD00; --ice: #EAF3FC; --ink2: #66748C;
          --shadow: 0 6px 22px rgba(18,32,58,.08); --wash: linear-gradient(135deg, #0078E8 0%, #39B5FF 21%, #DFF4FF 37%, #FFFFFF 48%, #FFFFFF 56%, #FFF8DA 66%, #FFE675 82%, #FFCC00 100%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Poppins, 'Segoe UI', Arial, sans-serif; color: var(--navy); overflow: hidden; background: #EAF3FC; }
  body::before { content: ""; position: fixed; inset: 0; background: var(--wash); z-index: 0; }
  button { font-family: inherit; }
  #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F2F5FA; opacity: 0; transition: opacity .35s; z-index: 1; }
  #portal.on { opacity: 1; }

  /* the star mascot */
  .star { display: block; } .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .star .blink { transform-origin: 50px 55px; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* splash: a white card on the wash */
  #splash { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity .35s; }
  #splash.off { opacity: 0; pointer-events: none; }
  .scard { width: 100%; max-width: 380px; background: #fff; border-radius: 32px; padding: 30px 24px 24px; text-align: center; box-shadow: 0 18px 50px rgba(18,32,58,.16); position: relative; }
  .scard .star { margin: -74px auto 6px; filter: drop-shadow(0 10px 14px rgba(18,32,58,.18)); }
  .brand { font-size: 30px; font-weight: 800; letter-spacing: .5px; line-height: 1; }
  .brand small { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink2); }
  #state { margin-top: 20px; min-height: 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .note { margin: 0; font-size: 14px; color: var(--ink2); line-height: 1.55; max-width: 300px; }
  .note b { color: var(--navy); }

  /* buttons, like the website */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 13px 22px; font: 700 14px Poppins, Arial, sans-serif;
          cursor: pointer; text-decoration: none; background: var(--navy); color: #fff; box-shadow: 0 4px 0 #050C1A; transition: transform .06s, box-shadow .06s; }
  .pill:active { transform: translateY(3px); box-shadow: 0 1px 0 #050C1A; }
  .pill.sun { background: #FFDD00 linear-gradient(90deg, #FFDD00 0%, #FFF3A0 50%, #7CCBFF 100%); color: var(--navy); border-bottom: 3px solid var(--blue);
              box-shadow: 0 4px 12px rgba(0,153,255,.3); font-weight: 800; letter-spacing: .6px; text-transform: uppercase; font-size: 13px; }
  .pill.sun:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(0,153,255,.3); }
  .pill.light { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); box-shadow: none; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; font-size: 13px; }
  .pill[disabled] { background: #E7EBF1; color: #9AA6B8; border: 0; border-bottom: 3px solid #D3DAE4; box-shadow: none; cursor: default; transform: none; }
  .regions { display: grid; gap: 10px; width: 100%; }
  .regions button { background: var(--ice); color: var(--navy); border: 0; border-radius: 18px; padding: 14px 16px; font: 700 15px Poppins, Arial, sans-serif; text-align: left; cursor: pointer; box-shadow: 0 4px 0 #D6E4F5; }
  .regions button:hover { background: #FFF3B0; }

  /* install hint (bottom sheet) and the region switch */
  #hint { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; display: none; align-items: center; gap: 12px; max-width: 520px; margin: 0 auto;
          background: #fff; color: var(--navy); border-radius: 24px; padding: 12px 14px; box-shadow: 0 12px 34px rgba(18,32,58,.22); font-size: 13px; line-height: 1.4; }
  #hint .star { flex: none; }
  #hint b { display: block; font-size: 14px; } #hint span { color: var(--ink2); }
  #hint .x { background: var(--ice); border: 0; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--navy); cursor: pointer; margin-left: auto; flex: none; }
  #hint .pill { padding: 9px 16px; font-size: 13px; white-space: nowrap; }
  #switch { position: fixed; left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; display: none; background: #fff; color: var(--navy); border: 0;
            border-radius: 999px; padding: 6px 12px; font: 700 11.5px Poppins, Arial, sans-serif; cursor: pointer; box-shadow: var(--shadow); }
  #rescue { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; max-width: 560px; margin: 0 auto; background: #fff; color: var(--navy);
    border-radius: 24px; padding: 14px 16px; box-shadow: 0 14px 36px rgba(18,32,58,.25); font: 13.5px/1.5 Poppins, Arial, sans-serif; display: flex; gap: 12px; align-items: flex-start; }
  #rescue .star { flex: none; } #rescue p { margin: 0 0 10px; } #rescue .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #rescue .pill { padding: 9px 16px; font-size: 13px; }

  /* ---------- offline: the saved page ---------- */
  #off { position: fixed; inset: 0; z-index: 7; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .owrap { max-width: 600px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .ostat { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; }
  .ostat i { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px rgba(255,221,0,.25); }
  .ohead { display: flex; gap: 14px; align-items: center; margin: 16px 0 14px; }
  .ohead h1 { margin: 0; font-size: clamp(24px, 7vw, 30px); font-weight: 800; line-height: 1.1; } .ohead p { margin: 4px 0 0; color: var(--navy); opacity: .7; font-size: 14px; font-weight: 600; }
  .stk { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stk div { flex: 1 1 150px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; box-shadow: 0 5px 0 rgba(18,32,58,.10); min-width: 0; }
  .stk div.navy { background: var(--navy); color: #fff; } .stk div.sky { background: var(--sky); } .stk div.sunl { background: var(--sun); }
  .stk em { flex: none; width: 46px; height: 46px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; }
  .stk div.navy em { background: var(--sun); }
  .stk b { display: block; font-size: 20px; line-height: 1.1; } .stk small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; opacity: .8; }
  .card { background: #fff; border-radius: 24px; padding: 18px 20px; margin: 0 0 14px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 4px; font-size: 17px; } .card p { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.5; }
  .card.ok { border-left: 6px solid #1E8E3E; } .card.wait { border-left: 6px solid var(--sun); } .card.brain { border-left: 6px solid var(--blue); }
  .hero { position: relative; overflow: hidden; background: #12203A linear-gradient(135deg, #12203A 0%, #163A6B 60%, #005CAA 100%); color: #fff; border-radius: 28px; padding: 22px 20px 20px; margin-bottom: 14px; }
  .hero .badge { display: inline-block; background: var(--sun); color: var(--navy); font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; }
  .hero h2 { margin: 10px 0 4px; font-size: 22px; } .hero p { margin: 0 0 16px; color: #CFE0F3; font-size: 14px; max-width: 70%; }
  .hero .star { position: absolute; right: 10px; bottom: 6px; }
  .sech { margin: 20px 4px 10px; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
  .tk { display: flex; align-items: stretch; background: #fff; border-radius: 20px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .tk .td { flex: none; width: 70px; display: grid; place-items: center; text-align: center; background: var(--sun); font-weight: 800; line-height: 1.05; padding: 10px 4px; border-right: 2px dashed rgba(18,32,58,.25); }
  .tk .td small { display: block; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; } .tk .td b { font-size: 22px; }
  .tk .tx { padding: 12px 14px; min-width: 0; } .tk .tx b { display: block; font-size: 14.5px; overflow-wrap: anywhere; } .tk .tx span { color: var(--ink2); font-size: 13px; }
  .oagain { margin-top: 18px; width: 100%; }

  /* ---------- offline check-in: one question at a time, like the website ---------- */
  .ckwrap { display: flex; flex-direction: column; min-height: 100%; } .ckwrap .q { flex: 1; }
  .ckwrap .lf { margin-top: auto; }
  .lt { display: flex; align-items: center; gap: 12px; }
  .lt .x { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; box-shadow: var(--shadow); font-size: 18px; cursor: pointer; color: var(--navy); }
  .prog { flex: 1; height: 12px; background: #fff; border-radius: 999px; box-shadow: var(--shadow); position: relative; }
  .prog i { display: block; position: relative; height: 100%; background: linear-gradient(90deg, #0099FF 0%, #7CCBFF 55%, #FFDD00 100%); border-radius: 999px; transition: width .3s; min-width: 12px; }
  .prog .ride { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); } .prog .ride .star { filter: drop-shadow(0 2px 3px rgba(18,32,58,.25)); }
  .kick { margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--navy); opacity: .7; }
  .q h2 { margin: 4px 0 0; font-size: clamp(21px, 6vw, 26px); line-height: 1.25; }
  .coach { display: flex; align-items: center; gap: 10px; margin: 12px 0 16px; }
  .say { background: #fff; border-radius: 16px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: #fff; border: 0; border-radius: 22px; padding: 12px 16px 12px 12px; font: 600 15px Poppins, Arial, sans-serif;
         color: var(--navy); cursor: pointer; box-shadow: 0 4px 0 #DFE6EF; transition: transform .12s, background .15s; min-height: 64px; }
  .opt:active { transform: scale(.98); }
  .opt[aria-pressed="true"] { background: var(--sun); box-shadow: 0 4px 0 #D4B200; }
  .opt .ic { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--ice); display: grid; place-items: center; }
  .opt[aria-pressed="true"] .ic { background: #fff; }
  .opt .tick { margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid #CBD3DE; display: grid; place-items: center; font-weight: 800; color: transparent; }
  .opt[aria-pressed="true"] .tick { background: var(--navy); border-color: var(--navy); color: var(--sun); }
  /* the mood card: the same face and slider as the website */
  .moodcard { position: relative; border-radius: 28px; overflow: hidden; background: var(--bg); transition: background .35s; box-shadow: 0 14px 30px rgba(18,32,58,.22); max-width: 420px; margin: 0 auto; }
  .mface { display: block; width: 100%; height: auto; padding: 22px 30px 6px; }
  /* short screens (laptops, small phones): the face gets what height is left; the card keeps its width so nothing wraps */
  .mface { max-height: clamp(150px, calc(100vh - 430px), 380px); max-height: clamp(150px, calc(100dvh - 430px), 380px); }
  @media (max-height: 780px) {
    #ock-none {}
    .mpanel { padding: 16px 20px 8px; } .mface { padding-top: 14px; }
    .kick { margin-top: 10px; } .q h2 { font-size: 22px; } .coach { margin: 8px 0 10px; } .coach .star { width: 40px; height: 40px; } .lf { padding-top: 8px; margin-top: 8px; }
  }
  .mface .eyes { transition: transform .35s cubic-bezier(.2,1.4,.4,1); }
  .mface .eye circle:first-child { filter: drop-shadow(0 6px 4px rgba(18,32,58,.25)); }
  .mface .mm { opacity: 0; transform-origin: 100px 140px; transform: scale(.6); transition: opacity .25s, transform .3s cubic-bezier(.2,1.6,.4,1); }
  .moodcard[data-p="0"] .m0, .moodcard[data-p="1"] .m1, .moodcard[data-p="2"] .m2, .moodcard[data-p="3"] .m3 { opacity: 1; transform: scale(1); }
  .mpanel { position: relative; background: #fff; border-radius: 30px 30px 0 0; margin-top: 8px; padding: 22px 22px 12px; }
  .mpanel input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; position: relative; z-index: 2; cursor: grab; }
  .mpanel input[type=range]::-webkit-slider-runnable-track { height: 34px; background: transparent; }
  .mpanel input[type=range]::-moz-range-track { height: 34px; background: transparent; }
  .mpanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 46px; height: 46px; margin-top: -6px; border-radius: 50%; background: var(--bg); border: 5px solid #fff; box-shadow: 0 6px 14px rgba(18,32,58,.3), inset 0 0 0 2px rgba(18,32,58,.15); transition: background .35s; }
  .mpanel input[type=range]::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 5px solid #fff; box-shadow: 0 6px 14px rgba(18,32,58,.3); }
  .mticks { position: absolute; left: 44px; right: 44px; top: 32px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .mticks i { width: 4px; height: 22px; border-radius: 3px; background: #C9D6E6; } .mticks b { width: 4px; height: 4px; border-radius: 50%; background: #D7E1EE; }
  .mstops { display: flex; justify-content: space-between; gap: 4px; margin-top: 8px; }
  .mstop { flex: 1; padding: 6px 2px; border: 0; background: none; font: 700 12px Poppins, Arial, sans-serif; color: #5b6b84; text-align: center; cursor: pointer; }
  .mstop[aria-pressed="true"] { color: var(--navy); text-decoration: underline 3px #FFDD00; text-underline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .mface .eyes, .mface .mm, .moodcard { transition: none; } }
  .care { margin-top: 14px; background: #fff; border-radius: 18px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; border-left: 6px solid var(--blue); }
  .opt.ticket { padding: 0; overflow: hidden; gap: 0; position: relative; min-height: 76px; }
  .opt.ticket .tdate { flex: none; width: 72px; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--navy); color: #fff; line-height: 1.05; border-right: 3px dashed #EAF3FC; }
  .opt.ticket .tdate b { font-size: 24px; color: var(--sun); } .opt.ticket .tdate small { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .opt.ticket .tname { flex: 1; padding: 12px 92px 12px 16px; min-width: 0; overflow-wrap: anywhere; }
  .opt.ticket .stamp { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(-12deg) scale(.6); opacity: 0; border: 2.5px solid var(--blue); color: var(--blue); border-radius: 8px;
                       padding: 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
  .opt.ticket[aria-pressed="true"] { background: #FFF3B0; box-shadow: 0 4px 0 #D4B200; } .opt.ticket[aria-pressed="true"] .stamp { opacity: 1; transform: translateY(-50%) rotate(-12deg) scale(1); }
  .opt.tnone { justify-content: center; color: #4b5b77; min-height: 52px; }
  .opt.sig .ic { border-radius: 50%; } .opt.sig.s0 .ic { background: #DDF5E6; } .opt.sig.s1 .ic { background: #DDF0FF; } .opt.sig.s2 .ic { background: #FDE3E3; }
  .opt.sig[aria-pressed="true"] { background: #FFF3B0; }
  .mbar { flex: none; width: 54px; height: 12px; border-radius: 999px; background: var(--ice); overflow: hidden; } .mbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--sky)); border-radius: inherit; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .starter { border: 0; background: #fff; border-radius: 999px; padding: 7px 12px; font: 700 12.5px Poppins, Arial, sans-serif; color: var(--navy); cursor: pointer; box-shadow: var(--shadow); }
  .pact .ic { flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--ice); display: grid; place-items: center; }
  .pact[aria-pressed="true"] { background: #FFF3B0; }
  .sticky { background: #FFF3B0; border-radius: 6px 6px 22px 6px; padding: 14px; box-shadow: 0 8px 18px rgba(18,32,58,.12); transform: rotate(-.6deg); }
  .sticky textarea { width: 100%; min-height: 130px; border: 0; background: transparent; resize: vertical; font: 500 15px/1.5 Poppins, Arial, sans-serif; color: var(--navy); outline: none; }
  .pact { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: #fff; border: 0; border-radius: 22px; padding: 14px 16px; cursor: pointer; box-shadow: 0 4px 0 #DFE6EF; font: 500 14px/1.45 Poppins, Arial, sans-serif; color: var(--navy); }
  .pact .sw { flex: none; width: 52px; height: 30px; border-radius: 99px; background: #CBD3DE; position: relative; transition: background .2s; }
  .pact .sw i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .2s cubic-bezier(.2,1.6,.4,1); }
  .pact[aria-pressed="true"] .sw { background: #1E8E3E; } .pact[aria-pressed="true"] .sw i { left: 25px; }
  .priv { margin: 10px 4px 0; font-size: 12px; color: var(--navy); opacity: .7; line-height: 1.5; }
  .lf { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 14px 0 max(14px, env(safe-area-inset-bottom)); margin-top: 18px; }
  .lf .pill { flex: 1; padding: 15px; } .lf .pill.sun { flex: 2; }
  .lf.solo { justify-content: center; } .lf.solo .pill.sun { flex: 0 1 360px; }
  .oerr { min-height: 20px; margin-top: 10px; color: #A1261B; font-weight: 700; font-size: 13.5px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .bob, .star .blink { animation: none; } .face, .opt, .pill { transition: none; } }

  /* ---------- the opening: yellow screen with a face → it shrinks into the START star → welcome ---------- */
  #splash { background: linear-gradient(145deg, #008CF5 0%, #46BFFF 22%, #E2F5FF 38%, #FFFFFF 48%, #FFFFFF 57%, #FFF6CF 68%, #FFDF57 84%, #FFCC00 100%); overflow: hidden; }
  .softbg { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(255,255,255,.97) 0%, rgba(255,255,255,.86) 24%, rgba(255,255,255,.35) 52%, rgba(255,255,255,0) 72%),
                linear-gradient(145deg, rgba(234,243,252,.55), rgba(255,255,255,.25) 50%, rgba(255,246,207,.5)); }
  /* the yellow screen IS the star (navy border included), drawn huge so its yellow fills the screen, then shrinking to mascot size */
  .sun-screen { position: fixed; z-index: 2; left: 50%; top: 50%; width: 168px; height: 168px; margin: -84px 0 0 -84px; overflow: visible;
                pointer-events: none; transform-origin: 50% 55%; transform: scale(40); }
  .scard { position: relative; z-index: 3; max-width: 320px; padding: 20px; background: transparent; border-radius: 0; box-shadow: none; }
  .mwrap { position: relative; width: 112px; height: 112px; margin: 0 auto 10px; transform-origin: 50% 50%; will-change: transform; }
  .mwrap > div, .mwrap > svg { position: absolute; inset: 0; }
  #splashstar { opacity: 0; } #splashstar .star { width: 100%; height: 100%; margin: 0; filter: drop-shadow(0 6px 8px rgba(18,32,58,.16)); }
  .face { width: 100%; height: 100%; transform-origin: 50% 50%; z-index: 4; overflow: visible; }
  .face .blink { transform-origin: 50px 55px; animation: blink 3.4s infinite; }
  .welcome { opacity: 0; }
  .welcome .hello { display: block; font-size: 14px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink2); }
  .welcome .brand { font-size: 34px; margin-top: 4px; }
  .welcome .rpill { display: inline-block; margin-top: 10px; background: var(--navy); color: var(--sun); font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; }
  #state { margin-top: 22px; min-height: 22px; gap: 0; }

<script src="config.js"></script>
<script>
(function () {
  var REGIONS = ((window.START_APP || {}).regions || []).filter(function (r) { return r && r.url; });
  var $ = function (id) { return document.getElementById(id); };

  // the START star (same drawing as the website)
  function star(size, cls) {
    var cx = 50, cy = 55, R = 41, r = 26, pts = [];
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; pts.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]); }
    var d = 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + 'Z';
    var soft = function (fill, w, extra) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + fill + '" stroke-width="' + w + '" stroke-linejoin="round"' + (extra || '') + '/>'; };

      '<ellipse cx="50" cy="95" rx="26" ry="3.6" fill="#12203A" opacity=".14"/>' + soft('#12203A', 16, ' transform="translate(0 3.5)"') + soft('#12203A', 16) +

      '<g class="blink"><ellipse cx="40.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/><ellipse cx="59.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/>' +

  function moodCard(pos, title) {

    var eye = function (cx) { return '<g class="eye"><circle cx="' + cx + '" cy="80" r="27" fill="url(#eyeg)" stroke="#12203A" stroke-opacity=".15" stroke-width="2"/>' +

    siren: '<path d="M6 18v-5a6 6 0 0 1 12 0v5M4 18h16v3H4zM12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4" fill="none" stroke="#12203A" stroke-width="1.8" stroke-linecap="round"/>',
    meter: '<path d="M4 16a8 8 0 0 1 16 0M12 16l4-5" fill="none" stroke="#12203A" stroke-width="2" stroke-linecap="round"/>',
    events: '<rect x="4" y="5.5" width="16" height="14" rx="3" fill="none" stroke="#12203A" stroke-width="1.8"/><path d="M8 3.5v4M16 3.5v4M4 10h16" stroke="#12203A" stroke-width="1.8" stroke-linecap="round"/>',
  };
  var ICON_SHIELD = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6z" fill="#FFDD00" stroke="#12203A" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#12203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function ico(n, s) { return '<svg viewBox="0 0 24 24" width="' + (s || 24) + '" height="' + (s || 24) + '" aria-hidden="true">' + (ICON[n] || '') + '</svg>'; }

  function show(html) { state.innerHTML = html; splash.classList.remove('off'); }
  function showNow(html) { finishIntro(); show(html); }
  function loadingBar() { show('<div class="quest-gems" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>'); }
  $('splashstar').innerHTML = star(112);
  // ---------- the opening ----------
  // 1 · full-screen yellow with a simple face   2 · the yellow shrinks into the START star (same face)   3 · the star gets smaller
  // and moves up, the background softens and "Welcome to DOST-START" appears. START opens as soon as both the intro and the website are ready.
  var INTRO = { M: 168, F: 112 };              // size of the star while it forms, and its final size
  var introDone = false, introWait = [];
  function afterIntro(fn) { if (introDone) fn(); else introWait.push(fn); }
  function finishIntro() {
    if (introDone) return; introDone = true;
    $('sunscreen').style.display = 'none'; $('face').style.display = 'none';

    introWait.splice(0).forEach(function (f) { f(); });
  }
  (function intro() {
    // the face alone: the star's own eyes, cheeks and smile (so it lines up exactly when the star appears)
    $('face').innerHTML = '<g class="blink"><ellipse cx="40.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/><ellipse cx="59.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/>' +
      '<circle cx="42.3" cy="52.4" r="2" fill="#fff"/><circle cx="61.3" cy="52.4" r="2" fill="#fff"/></g>' +
      '<ellipse cx="31.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/><ellipse cx="68.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/>' +
      '<path d="M45.6 62.4 q2.2 3 4.4 0 q2.2 3 4.4 0" fill="none" stroke="#12203A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>';

    // where the star sits while it forms: the middle of the screen
    var box = mw.getBoundingClientRect(), W = innerWidth, H = innerHeight;

    var pts = [];
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 26 : 41; pts.push((50 + rr * Math.cos(a)).toFixed(1) + ' ' + (55 + rr * Math.sin(a)).toFixed(1)); }
    var d = 'M' + pts.join(' L') + 'Z', soft = function (fill, w, extra) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + fill + '" stroke-width="' + w + '" stroke-linejoin="round"' + (extra || '') + '/>'; };
    sun.innerHTML = soft('#12203A', 16, ' transform="translate(0 3.5)"') + soft('#12203A', 16) + soft('#E9A800', 10, ' transform="translate(0 3)"') + soft('#FFD21F', 10);

        setTimeout(finishIntro, 1100);
      }, 1400);
    }, 750);
  })();
  $('hintstar').innerHTML = star(44);

  function pick() {
    if (!REGIONS.length || /PASTE_YOUR_WEBSITE_ID/.test(REGIONS[0].url)) {

      return '<button data-i="' + i + '">' + esc(x.name) + '</button>'; }).join('') + '</div>');
    [].forEach.call(state.querySelectorAll('button[data-i]'), function (b) {

  }

  function open(r) {
    current = r;
    if (!navigator.onLine) {
      if (offline(r)) return;
      showNow('<p class="note"><b>You are offline.</b><br>Connect to the internet to open START.</p><button class="pill sun" id="retry">Try again</button>');
      $('retry').onclick = function () { open(r); };
      return;
    }
    closeOffline();
    loadingBar();
    frame.classList.remove('on');

    $('switch').style.display = REGIONS.length > 1 ? 'block' : 'none';

  }
  /* ---------- offline: the saved copy of the scholar's page, and the weekly check-in kept on the phone ---------- */
  function snapOf(r) { try { return JSON.parse(store.get('start_snap:' + r.url) || 'null'); } catch (e) { return null; } }

  function plain(c) { var m = String(c).match(/^(\S+)\s+(.*)$/); return m && !/[A-Za-z0-9]/.test(m[1]) ? m[2] : String(c); }   // the answer without its emoji tag
  function closeOffline() { var o = $('off'); if (o) o.remove(); }
  function ago(t) { var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
  function offPage() { var o = $('off'); if (!o) { o = document.createElement('div'); o.id = 'off'; document.body.appendChild(o); } o.scrollTop = 0; return o; }
  function offline(r) {

  // The weekly check-in, offline: the same questions, one at a time, kept on this phone until START is reachable
  function offlineCheckin(r, sn) {
