<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>START Scholar Portal</title>
<meta name="description" content="Weekly check-ins, your school and START events for DOST-SEI START scholars.">
<meta name="theme-color" content="#12203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="START">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #12203A; --blue: #0099FF; --sky: #7CCBFF; --sun: #FFDD00; --ice: #EAF3FC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); font-family: Poppins, 'Segoe UI', Arial, sans-serif; color: #fff; overflow: hidden; }
  #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--ice); opacity: 0; transition: opacity .35s; }
  #portal.on { opacity: 1; }

  /* splash: the email hero, full screen */
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
            background: linear-gradient(160deg, #12203A 0%, #163A6B 60%, #005CAA 100%); transition: opacity .35s; z-index: 5; text-align: center; }
  #splash.off { opacity: 0; pointer-events: none; }
  #splash::before, #splash::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  #splash::before { width: 420px; height: 420px; right: -160px; top: -170px; border: 2px solid rgba(124,203,255,.18); }
  #splash::after { width: 260px; height: 260px; right: 10px; top: -90px; border: 2px solid rgba(255,221,0,.16); }
  .mark { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .name { font-size: 30px; font-weight: 800; letter-spacing: .5px; line-height: 1.05; text-transform: uppercase; }
  .name span { color: var(--sun); display: block; font-size: 15px; letter-spacing: 3px; margin-top: 6px; }
  .bar { width: 160px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, var(--blue), var(--sun)); border-radius: 6px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .note { font-size: 13px; color: #B9C3D6; max-width: 320px; line-height: 1.5; }
  .pillbtn { display: inline-block; background: var(--sun); color: var(--navy); border: 0; border-radius: 999px; padding: 12px 24px; font: 800 13px Poppins, Arial, sans-serif;
             letter-spacing: .8px; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid var(--blue); text-decoration: none; }
  .regions { display: grid; gap: 10px; width: 100%; max-width: 340px; }
  .regions button { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 14px 16px;
                    font: 700 15px Poppins, Arial, sans-serif; text-align: left; cursor: pointer; }
  .regions button:hover { border-color: var(--sun); }
  .signoff { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--sky); }

  /* install hint (bottom sheet) and the small region switch */
  #hint { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; display: none; align-items: center; gap: 12px;
          background: #fff; color: var(--navy); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(18,32,58,.35); font-size: 13px; line-height: 1.4; }
  #hint img { width: 40px; height: 40px; border-radius: 10px; }
  #hint b { display: block; font-size: 14px; }
  #hint .x { background: none; border: 0; font-size: 20px; color: #4B5B77; cursor: pointer; padding: 4px 6px; margin-left: auto; }
  #hint .pillbtn { padding: 9px 14px; font-size: 11px; white-space: nowrap; }
  #switch { position: fixed; left: 8px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 4; display: none; background: rgba(18,32,58,.55); color: #fff; border: 0;
            border-radius: 999px; padding: 5px 10px; font: 600 11px Poppins, Arial, sans-serif; cursor: pointer; }
  #rescue { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; background: #12203A; color: #fff;
    border-radius: 18px; padding: 14px 16px; box-shadow: 0 12px 30px rgba(18,32,58,.35); font: 13.5px/1.45 Poppins, Arial, sans-serif; }
  #rescue p { margin: 0 0 10px; } #rescue div { display: flex; gap: 8px; flex-wrap: wrap; }
  #rescue button, #rescue a { border: 0; border-radius: 999px; padding: 9px 16px; font: 700 13px Poppins, Arial, sans-serif; cursor: pointer; text-decoration: none; }
  #rescue button { background: #FFDD00; color: #12203A; } #rescue a { background: #fff; color: #12203A; }
  #off { position: fixed; inset: 0; z-index: 7; overflow-y: auto; background: linear-gradient(160deg, #EAF4FF 0%, #F7FBFF 55%, #FFF6BF 100%); color: var(--navy); }
  .obar { position: sticky; top: 0; background: var(--navy); color: #FFDD00; font: 700 12.5px Poppins, Arial, sans-serif; text-align: center; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .owrap { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); }
  .ohead { display: flex; gap: 12px; align-items: center; } .ohead img { width: 52px; height: 52px; border-radius: 14px; }
  .ohead h1, .owrap > h1 { margin: 0; font-size: 26px; font-weight: 800; } .ohead p { margin: 2px 0 0; color: #4b5b77; font-size: 14px; }
  .ochips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; } .ochips span { background: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 13px; box-shadow: 0 2px 8px rgba(18,32,58,.08); }
  .ocard { background: #fff; border-radius: 18px; padding: 14px 16px; margin: 10px 0; box-shadow: 0 4px 14px rgba(18,32,58,.08); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .ocard b { font-size: 15px; } .ocard span { color: #4b5b77; } .ocard.ok { border-left: 5px solid #1E8E3E; }
  .ocard.hero { background: var(--navy); color: #fff; } .ocard.hero span { color: #CFE0F3; } .ocard.hero .pillbtn { margin-top: 10px; align-self: flex-start; }
  .owrap h2 { font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; margin: 18px 0 6px; }
  .oev { background: #fff; border-radius: 14px; padding: 10px 14px; margin: 6px 0; display: flex; flex-direction: column; font-size: 14px; } .oev span { color: #4b5b77; font-size: 13px; }
  .pillbtn.light { background: #fff; border: 1.5px solid var(--navy); border-bottom-width: 3px; margin-top: 16px; }
  #off fieldset { border: 0; background: #fff; border-radius: 16px; padding: 12px 14px; margin: 12px 0; } #off legend { font-weight: 800; font-size: 15px; padding: 8px 0 4px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 2px; font-size: 14.5px; } .opt input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .opt.consent { background: #FFF6BF; border-radius: 14px; padding: 12px; font-size: 13px; }
  #off textarea { width: 100%; border: 1.5px solid #CBD3DE; border-radius: 12px; padding: 10px; font: 14px Poppins, Arial, sans-serif; }
  .oerr { color: #B3261E; font-weight: 700; font-size: 13.5px; min-height: 18px; } .orow { display: flex; gap: 10px; justify-content: flex-end; } .orow .pillbtn { margin-top: 0; }
</style>
</head>
<body>
<iframe id="portal" title="START Scholar Portal" allow="clipboard-write"></iframe>

<div id="splash">
  <img class="mark" src="icons/mark-256.png" alt="">
  <div class="name">START<span>Scholar Portal</span></div>
  <div id="state"><div class="bar"><i></i></div></div>
  <div class="signoff">✦ START · DOST-SEI</div>
</div>

<div id="hint" role="dialog" aria-label="Install the START app">
  <img src="icons/icon-192.png" alt="">
  <div><b>Install the START app</b><span id="hinttext">Open START from your home screen, like any app.</span></div>
  <button class="pillbtn" id="install" style="display:none">Install</button>
  <button class="x" id="hintx" aria-label="Close">×</button>
</div>
<button id="switch">⇄ Region</button>

<script src="config.js"></script>
<script>
(function () {
  var REGIONS = ((window.START_APP || {}).regions || []).filter(function (r) { return r && r.url; });
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('portal'), splash = $('splash'), state = $('state');
  var store = {                               // this app's own storage (first-party, so phones keep it)
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  };
  var current = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function show(html) { state.innerHTML = html; splash.classList.remove('off'); }
  function loadingBar() { show('<div class="bar"><i></i></div>'); }

  function pick() {
    if (!REGIONS.length || /PASTE_YOUR_WEBSITE_ID/.test(REGIONS[0].url)) {
      show('<p class="note">This app is not set up yet. Put your region\'s website address in <b>config.js</b>.</p>');
      return;
    }
    if (REGIONS.length === 1) return open(REGIONS[0]);
    var saved = store.get('start_region');
    var r = REGIONS.filter(function (x) { return x.url === saved; })[0];
    if (r) return open(r);
    show('<p class="note">Which region are you in?</p><div class="regions">' + REGIONS.map(function (x, i) {
      return '<button data-i="' + i + '">' + esc(x.name) + '</button>'; }).join('') + '</div>');
    [].forEach.call(state.querySelectorAll('button[data-i]'), function (b) {
      b.onclick = function () { var x = REGIONS[Number(b.getAttribute('data-i'))]; store.set('start_region', x.url); open(x); };
    });
  }

  function open(r) {
    current = r;
    if (!navigator.onLine) {
      if (offline(r)) return;
      show('<p class="note">You are offline. Connect to the internet to open START.</p><button class="pillbtn" id="retry">Try again</button>');
      $('retry').onclick = function () { open(r); };
      return;
    }
    closeOffline();
    loadingBar();
    frame.classList.remove('on');
    var u = r.url + (r.url.indexOf('?') === -1 ? '?' : '&') + 'app=' + encodeURIComponent(location.origin + location.pathname);
    frame.src = u;
    $('switch').style.display = REGIONS.length > 1 ? 'block' : 'none';
    clearTimeout(open.t);
    open.t = setTimeout(slow, 12000);         // never stay on the splash forever
    rescue(false);
  }
  /* ---------- offline: the saved copy of the scholar's page, and the weekly check-in kept on the phone ---------- */
  function snapOf(r) { try { return JSON.parse(store.get('start_snap:' + r.url) || 'null'); } catch (e) { return null; } }
  function sharedStore(r) { var k = 'start_store:' + r.url, all = {}; try { all = JSON.parse(store.get(k) || '{}') || {}; } catch (e) { all = {}; } return { all: all, save: function () { store.set(k, JSON.stringify(all)); } }; }
  function pendingOf(r) { try { var p = JSON.parse(sharedStore(r).all.start_pending || 'null'); return p && Date.now() - p.at < 7 * 86400000 ? p : null; } catch (e) { return null; } }
  function plain(c) { var m = String(c).match(/^(\S+)\s+(.*)$/); return m && !/[A-Za-z0-9]/.test(m[1]) ? m[2] : String(c); }   // the answer without its emoji tag
  function closeOffline() { var o = $('off'); if (o) o.remove(); }
  function ago(t) { var m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
  function offline(r) {
    var sn = snapOf(r);
    if (!sn) return false;
    closeOffline(); splash.classList.add('off');
    var o = document.createElement('div'); o.id = 'off'; document.body.appendChild(o);
    var ck = sn.checkin, pend = pendingOf(r);
    var status = pend ? '<div class="ocard ok"><b>Check-in saved on this phone</b><span>It will be sent by itself when you are back online.</span></div>'
      : sn.done ? '<div class="ocard ok"><b>You\'re all set this week</b><span>Thanks for checking in.</span></div>'
      : ck && ck.open ? '<div class="ocard hero"><b>Time for your check-in</b><span>Due ' + esc(ck.due || '') + '. You can answer it now, offline.</span><button class="pillbtn" id="ock">Answer the check-in</button></div>'
      : '<div class="ocard"><b>Check-in is closed</b><span>' + (ck && ck.opens ? 'The next one opens on ' + esc(ck.opens) + '.' : '') + '</span></div>';
    o.innerHTML = '<div class="obar">Offline · last updated ' + ago(sn.at) + '</div><div class="owrap">' +
      '<div class="ohead"><img src="icons/mark-256.png" alt=""><div><h1>Hi, ' + esc(sn.first || 'there') + '</h1><p>' + esc(sn.school || '') + '</p></div></div>' +
      '<div class="ochips"><span>' + (sn.streak || 0) + '-week streak</span>' + (sn.level ? '<span>' + (sn.xp || 0) + ' XP · ' + esc(sn.level) + '</span>' : '') + '</div>' +
      status + (sn.note ? '<div class="ocard"><b>' + esc(sn.rr || 'Your RR') + '</b><span>' + esc(sn.note) + '</span></div>' : '') +
      ((sn.events || []).length ? '<h2>Coming up</h2>' + sn.events.map(function (e) { return '<div class="oev"><b>' + esc(e.title) + '</b><span>' + esc(e.when) + (e.place ? ' · ' + esc(e.place) : '') + '</span></div>'; }).join('') : '') +
      '<button class="pillbtn light" id="otry">Try again online</button></div>';
    $('otry').onclick = function () { if (navigator.onLine) open(r); };
    if ($('ock')) $('ock').onclick = function () { offlineCheckin(r, sn); };
    return true;
  }
  function offlineCheckin(r, sn) {
    var ck = sn.checkin, o = $('off');
    var q = (ck.q || []).map(function (x, i) {
      var name = 'oq' + i;
      if (x.type === 'text') return '<fieldset><legend>' + esc(x.title) + '</legend><textarea id="' + name + '" maxlength="900" rows="3"></textarea></fieldset>';
      return '<fieldset><legend>' + esc(x.title) + '</legend>' + x.choices.map(function (c) {
        return '<label class="opt"><input type="' + (x.type === 'many' ? 'checkbox' : 'radio') + '" name="' + name + '" value="' + esc(c) + '"> <span>' + esc(plain(c)) + '</span></label>'; }).join('') + '</fieldset>';
    }).join('');
    o.innerHTML = '<div class="obar">Offline check-in · saved on this phone until you are online</div><div class="owrap"><h1>Weekly check-in</h1>' + q +
      '<label class="opt consent"><input type="checkbox" id="ocons"> <span>' + esc(ck.consent || 'I agree to the data privacy notice.') + '</span></label>' +
      '<p class="oerr" id="oerr"></p><div class="orow"><button class="pillbtn light" id="oback">Back</button><button class="pillbtn" id="osave">Save</button></div></div>';
    $('oback').onclick = function () { offline(r); };
    o.onchange = function () { $('oerr').textContent = ''; };
    $('osave').onclick = function () {
      var a = {}, miss = '';
      (ck.q || []).forEach(function (x, i) {
        var name = 'oq' + i;
        if (x.type === 'text') { a[x.k] = ($(name).value || '').trim().slice(0, 900); return; }
        var picked = [].map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (e) { return e.value; });
        if (!picked.length && !miss) miss = x.title;
        a[x.k] = x.type === 'many' ? (picked.indexOf(x.none) !== -1 ? [x.none] : picked) : (picked[0] || '');
      });
      if (miss) { $('oerr').textContent = 'Please answer: ' + miss; return; }
      if (!$('ocons').checked) { $('oerr').textContent = 'Please tick the data privacy consent.'; return; }
      a.consent = true;
      var st = sharedStore(r); st.all.start_pending = JSON.stringify({ a: a, at: Date.now(), email: sn.email }); st.save();
      offline(r);
    };
  }
  function reveal() { frame.classList.add('on'); splash.classList.add('off'); }
  // START did not say "ready": Google may be showing its own error page (often: signed into several Google accounts).
  // Show START anyway, with a small bar to try again or open it in the browser.
  function slow() { reveal(); rescue(true); }
  function rescue(on) {
    var b = $('rescue');
    if (!on) { if (b) b.remove(); return; }
    if (b || !current) return;
    b = document.createElement('div'); b.id = 'rescue';
    b.innerHTML = '<p><b>START is taking long to open.</b> If you see "unable to open the file", you may be signed into more than one Google account. ' +
      'Try again, or open START in your browser.</p><div><button id="rtry">Try again</button><a id="ropen" target="_blank" rel="noopener">Open in browser</a></div>';
    document.body.appendChild(b);
    $('rtry').onclick = function () { open(current); };
    $('ropen').href = current.url;
  }

  // The portal (inside Google's frame) talks to the app: "ready", and saving the sign-in here
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(e.origin)) return;
    var d = e.data || {};
    if (d.start === 'ready') { clearTimeout(open.t); reveal(); rescue(false); return; }
    if (d.start === 'snapshot' && current && d.data) { var j = JSON.stringify(d.data); if (j.length < 40000) store.set('start_snap:' + current.url, j); return; }
    if (d.start !== 'store' || !current) return;
    var key = 'start_store:' + current.url, all = {};
    try { all = JSON.parse(store.get(key) || '{}') || {}; } catch (err) { all = {}; }
    if (d.op === 'get') { e.source.postMessage({ start: 'store', op: 'all', data: all }, e.origin); return; }
    if (d.op === 'set' && typeof d.k === 'string' && d.k.indexOf('start_') === 0) {
      if (d.v == null) delete all[d.k]; else all[d.k] = String(d.v).slice(0, 2000);
      store.set(key, JSON.stringify(all));
    }
  });

  $('switch').onclick = function () { store.set('start_region', null); frame.classList.remove('on'); frame.src = 'about:blank'; pick(); };
  window.addEventListener('online', function () { if (current && (!frame.classList.contains('on') || $('off'))) open(current); });

  // Install: Android/desktop Chrome give a button; iPhone needs Share › Add to Home Screen
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null;
  function hint(text, withButton) {
    if (standalone || store.get('start_hint_closed')) return;
    $('hinttext').textContent = text; $('install').style.display = withButton ? '' : 'none'; $('hint').style.display = 'flex';
  }
  $('hintx').onclick = function () { $('hint').style.display = 'none'; store.set('start_hint_closed', String(Date.now())); };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; hint('Add START to your home screen.', true); });
  $('install').onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; $('hint').style.display = 'none'; });
  };
  window.addEventListener('appinstalled', function () { $('hint').style.display = 'none'; });
  if (ios && !standalone) setTimeout(function () { hint('Tap the Share button, then "Add to Home Screen".', false); }, 2500);

  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  pick();
})();
</script>
</body>
</html>
