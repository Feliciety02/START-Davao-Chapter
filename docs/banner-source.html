<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>START README banner</title>
<!-- Source for docs/readme-banner.png. Render at 1100x320, device scale 2 (headless Edge). -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#12203A; --blue:#0099FF; --sky:#7CCBFF; --sun:#FFDD00; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1100px; height:320px; background:transparent; font-family:Poppins, 'Segoe UI', Arial, sans-serif; color:#fff; }
  .card { position:absolute; inset:0; overflow:hidden; border-radius:26px; background:linear-gradient(120deg,#12203A 0%,#163A6B 55%,#0B5FA8 100%); }
  .dots { position:absolute; right:0; top:0; width:500px; height:320px; background-image:radial-gradient(rgba(124,203,255,.28) 1.2px, transparent 1.5px); background-size:20px 20px;
          -webkit-mask:linear-gradient(90deg, transparent, #000 40%); mask:linear-gradient(90deg, transparent, #000 40%); }
  .ring { position:absolute; border-radius:50%; border:1.5px solid rgba(124,203,255,.22); }
  .r1 { width:300px; height:300px; right:70px; top:10px; }
  .r2 { width:420px; height:420px; right:10px; top:-50px; }
  .r3 { width:200px; height:200px; right:120px; top:60px; background:radial-gradient(circle, rgba(255,221,0,.22), rgba(255,221,0,0) 70%); border:0; }

  .text { position:absolute; left:52px; top:40px; width:560px; }
  .pill { display:inline-flex; align-items:center; gap:10px; padding:7px 16px 7px 13px; border-radius:999px; background:rgba(255,255,255,.12);
          font-size:12.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:#EAF3FC; }
  .pill i { width:9px; height:9px; border-radius:50%; background:var(--sun); }
  h1 { margin-top:16px; font-size:62px; font-weight:800; line-height:1; letter-spacing:-1.5px; }
  h1 span { color:var(--sun); }
  .sub { margin-top:12px; font-size:19px; font-weight:500; color:#DCEBFA; }
  .rule { margin-top:22px; width:430px; height:1.5px; background:rgba(124,203,255,.35); }
  .tag { margin-top:16px; font-size:13px; font-weight:600; letter-spacing:1.2px; color:#B9C6DC; }

  .star { position:absolute; right:100px; top:28px; width:240px; height:240px; transform:rotate(8deg); filter:drop-shadow(0 18px 24px rgba(5,12,26,.35)); }
  .spark { position:absolute; }
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <div class="ring r2"></div>
  <div class="ring r1"></div>
  <div class="ring r3"></div>

  <div class="text">
    <div class="pill"><i></i>DOST-SEI START · Region XI</div>
    <h1>START <span>Portal</span></h1>
    <p class="sub">Weekly check-ins and Journey for Davao scholars</p>
    <div class="rule"></div>
    <p class="tag">CHECK IN / PLAY BRAIN BREAKS / EARN XP</p>
  </div>

  <div class="star" id="bigstar"></div>
  <svg class="spark" style="right:380px;top:70px" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z" fill="#FFDD00"/></svg>
  <svg class="spark" style="right:60px;top:40px" width="16" height="16" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z" fill="#fff"/></svg>
  <svg class="spark" style="right:350px;bottom:60px" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z" fill="#7CCBFF"/></svg>
</div>
<script>
  // the START star, copied from index.html
  function star(size) {
    var cx = 50, cy = 55, R = 41, r = 26, pts = [];
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; pts.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]); }
    var d = 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + 'Z';
    var soft = function (fill, w, extra) { return '<path d="' + d + '" fill="' + fill + '" stroke="' + fill + '" stroke-width="' + w + '" stroke-linejoin="round"' + (extra || '') + '/>'; };
    return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      soft('#12203A', 16, ' transform="translate(0 3.5)"') + soft('#12203A', 16) +
      soft('#E9A800', 10, ' transform="translate(0 3)"') + soft('#FFD21F', 10) +
      '<path d="' + d + '" fill="#FFE77A" transform="translate(50 50) scale(.6) translate(-50 -55)" opacity=".75"/>' +
      '<ellipse cx="33" cy="38" rx="6.5" ry="3.4" fill="#fff" opacity=".7" transform="rotate(-32 33 38)"/><circle cx="41.5" cy="31" r="1.9" fill="#fff" opacity=".8"/>' +
      '<ellipse cx="40.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/><ellipse cx="59.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/>' +
      '<circle cx="42.3" cy="52.4" r="2" fill="#fff"/><circle cx="61.3" cy="52.4" r="2" fill="#fff"/>' +
      '<ellipse cx="31.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/><ellipse cx="68.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/>' +
      '<path d="M45.6 62.4 q2.2 3 4.4 0 q2.2 3 4.4 0" fill="none" stroke="#12203A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  document.getElementById('bigstar').innerHTML = star(240);
</script>
</body>
</html>
