<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">START Scholar Portal, Region XI · Davao</title>
  <desc id="desc">The START star beside the portal name, and the navy weekly check-in card from the app's Home page.</desc>
  <defs>
    <!-- the app's page background -->
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset=".48" stop-color="#EAF3FC"/>
      <stop offset="1" stop-color="#FFDD00"/>
    </linearGradient>
    <!-- the stripe on cards and the sidebar -->
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset=".55" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#FFDD00"/>
    </linearGradient>
    <!-- the navy check-in card -->
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203A"/>
      <stop offset=".6" stop-color="#163A6B"/>
      <stop offset="1" stop-color="#005CAA"/>
    </linearGradient>
    <!-- the yellow pill button -->
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFDD00"/>
      <stop offset=".5" stop-color="#FFF3A0"/>
      <stop offset="1" stop-color="#7CCBFF"/>
    </linearGradient>
    <radialGradient id="eye" cx=".38" cy=".32" r=".7">
      <stop offset=".55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EAF3"/>
    </radialGradient>
    <clipPath id="cardclip"><rect x="24" y="24" width="1152" height="292" rx="26"/></clipPath>
    <clipPath id="heroclip"><rect x="688" y="58" width="452" height="224" rx="28"/></clipPath>
    <path id="star" d="M50.0 14.0 L65.3 34.0 L89.0 42.3 L74.7 63.0 L74.1 88.2 L50.0 81.0 L25.9 88.2 L25.3 63.0 L11.0 42.3 L34.7 34.0Z"/>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#page)"/>

  <!-- white panel, like the sidebar and sign-in card -->
  <rect x="24" y="30" width="1152" height="292" rx="26" fill="#12203A" opacity=".08"/>
  <rect x="24" y="24" width="1152" height="292" rx="26" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="5" fill="url(#stripe)" clip-path="url(#cardclip)"/>

  <!-- the START star mascot, same drawing as the app -->
  <g transform="translate(64 56) scale(.9)">
    <ellipse cx="50" cy="95" rx="26" ry="3.6" fill="#12203A" opacity=".14"/>
    <use href="#star" fill="#12203A" stroke="#12203A" stroke-width="16" stroke-linejoin="round" transform="translate(0 3.5)"/>
    <use href="#star" fill="#12203A" stroke="#12203A" stroke-width="16" stroke-linejoin="round"/>
    <use href="#star" fill="#E9A800" stroke="#E9A800" stroke-width="10" stroke-linejoin="round" transform="translate(0 3)"/>
    <use href="#star" fill="#FFD21F" stroke="#FFD21F" stroke-width="10" stroke-linejoin="round"/>
    <use href="#star" fill="#FFE77A" opacity=".75" transform="translate(50 50) scale(.6) translate(-50 -55)"/>
    <ellipse cx="33" cy="38" rx="6.5" ry="3.4" fill="#FFFFFF" opacity=".7" transform="rotate(-32 33 38)"/>
    <circle cx="41.5" cy="31" r="1.9" fill="#FFFFFF" opacity=".8"/>
    <ellipse cx="31.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/>
    <ellipse cx="68.5" cy="63" rx="4.6" ry="2.8" fill="#FF8FA3" opacity=".7"/>
    <ellipse cx="40.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/>
    <ellipse cx="59.5" cy="55" rx="4.8" ry="6.2" fill="#12203A"/>
    <circle cx="42.3" cy="52.4" r="2" fill="#FFFFFF"/>
    <circle cx="61.3" cy="52.4" r="2" fill="#FFFFFF"/>
    <path d="M45.6 62.4 q2.2 3 4.4 0 q2.2 3 4.4 0" fill="none" stroke="#12203A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif" fill="#12203A">
    <text x="164" y="104" font-size="20" font-weight="800" letter-spacing=".3">START</text>
    <text x="164" y="126" font-size="14" font-weight="600" fill="#4B5B77">Region XI · Davao</text>

    <text x="64" y="205" font-size="44" font-weight="800" letter-spacing="-.5">START Scholar Portal</text>
    <text x="66" y="240" font-size="16.5" fill="#4B5B77">Weekly check-ins, a Journey with XP and rewards,</text>
    <text x="66" y="263" font-size="16.5" fill="#4B5B77">and school updates, all in one place.</text>

    <rect x="66" y="281" width="4" height="15" rx="2" fill="#FFDD00"/>
    <text x="78" y="294" font-size="11.5" font-weight="800" letter-spacing="1.1">SCHOLARS · CAMPUS LEADS · REGIONAL REPRESENTATIVES</text>
  </g>

  <!-- the Home page check-in card -->
  <rect x="688" y="58" width="452" height="224" rx="28" fill="url(#hero)"/>
  <rect x="688" y="276" width="452" height="6" fill="url(#stripe)" clip-path="url(#heroclip)"/>

  <g transform="translate(1066 98)">
    <circle cx="0" cy="3" r="15" fill="#000000" opacity=".25"/>
    <circle cx="0" cy="0" r="15" fill="url(#eye)"/>
    <circle cx="-2" cy="2" r="6" fill="#12203A"/><circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    <circle cx="34" cy="3" r="15" fill="#000000" opacity=".25"/>
    <circle cx="34" cy="0" r="15" fill="url(#eye)"/>
    <circle cx="32" cy="2" r="6" fill="#12203A"/><circle cx="34" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">
    <rect x="716" y="84" width="118" height="26" rx="13" fill="#FFDD00"/>
    <text x="775" y="101.5" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.2" fill="#12203A">✦ THIS WEEK</text>

    <text x="716" y="158" font-size="23" font-weight="800" fill="#FFFFFF">TIME FOR YOUR CHECK-IN</text>
    <text x="716" y="184" font-size="15" fill="#B9C6DC">About a minute. Due Friday.</text>

    <rect x="716" y="205" width="212" height="47" rx="23.5" fill="#0099FF"/>
    <rect x="716" y="205" width="212" height="44" rx="22" fill="url(#pill)"/>
    <text x="822" y="232" text-anchor="middle" font-size="13" font-weight="800" letter-spacing=".6" fill="#12203A">START CHECK-IN →</text>
  </g>
</svg>
