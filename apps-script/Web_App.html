<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- START website: white, friendly and easy to tap (big cards and buttons), in the START colours -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
  /* START website: soft and friendly (light background, big rounded cards, yellow highlights), START colours only */
  :root {
    --navy: #12203A; --navy2: #23365C; --blue: #0099FF; --blue-d: #0077C8; --sky: #EAF3FC; --sky2: #7CCBFF; --sun: #FFDD00; --sun-l: #FFF3B0;
    --bg: #F2F5FA; --line: #E6ECF3; --ink2: #66748C; --soft: #F7F9FC;
    --g-bg: #E2F5E9; --g-fg: #17643A; --y-bg: #FFF3B0; --y-fg: #6B5200; --r-bg: #FDE5E2; --r-fg: #A1261B; --s-bg: #EDF1F6; --s-fg: #3F4A5C;
    --r: 24px; --shadow: 0 6px 22px rgba(18,32,58,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--navy); font-family: Poppins, 'Segoe UI', Arial, sans-serif; font-size: 15px; line-height: 1.5; background: var(--bg); }
  a { color: var(--blue-d); font-weight: 600; text-decoration: none; }
  button { font-family: inherit; color: inherit; }
  .muted { color: var(--ink2); font-size: 13.5px; }
  svg.ico { display: inline-block; vertical-align: middle; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  svg.ico .f { fill: var(--sun); stroke: none; } svg.ico .b { fill: var(--sky2); stroke: none; }
  .tab[aria-current="page"] svg.ico .f { fill: #fff; }
  .tile.navy svg.ico { color: var(--sun); } .tile.navy svg.ico .f { fill: rgba(255,221,0,.25); }

  /* Material Symbols Outlined: one coherent, flat Google icon language.
     Original SVG icons remain as fallback when the font cannot load (offline). */
  .material-icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
    line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal;
    direction: ltr; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle; flex: none; }
  .material-icon { display: none; }
  body.material-ready .material-icon { display: inline-flex; }
  body.material-ready .icon-fallback { display: none; }
  .tab .ic { color: var(--navy); }
  .tab[aria-current="page"] { background: #EAF3FC; box-shadow: none; color: var(--navy); }
  .tab[aria-current="page"] .material-icon { color: var(--blue-d); }
  .jstat .material-icon { color: inherit; }
  .tile.navy .material-icon { color: var(--sun); }
  .tab .material-icon { width: 26px; height: 26px; }

  /* the START mark only */
  .smark { display: inline-block; flex: none; background-repeat: no-repeat; }
  .brandrow { display: flex; align-items: center; gap: 10px; }
  .brandrow b { font-size: 18px; font-weight: 800; letter-spacing: .3px; line-height: 1.1; }
  .brandrow span { font-size: 12px; color: var(--ink2); font-weight: 600; }

  /* ---------- layout: side menu (computer), bottom bar (phone) ---------- */
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); max-width: 1220px; margin: 0 auto; min-height: 100vh; }
  aside.sidebar { position: sticky; top: 0; height: 100vh; padding: 28px 16px 20px 24px; display: flex; flex-direction: column; }
  .brand { padding: 0 6px 26px; }
  nav.side { display: flex; flex-direction: column; gap: 6px; }
  .tab { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 999px; border: 0; background: none; color: var(--ink2);
         font-weight: 600; font-size: 14.5px; cursor: pointer; width: 100%; text-align: left; position: relative; }
  .tab .ic { font-size: 18px; width: 28px; text-align: center; display: grid; place-items: center; } .tab svg.ico { stroke-width: 2.1; }
  .tab .ic svg.ico .f { fill: var(--sun); } .tab:not([aria-current="page"]) .ic { color: var(--blue); } .tab[aria-current="page"] .ic svg.ico .f { fill: #fff; }
  .tab:hover { background: #fff; color: var(--navy); }
  .tab[aria-current="page"] { background: var(--sun); color: var(--navy); font-weight: 700; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #E5484D; margin-left: auto; }
  .sidegrow { flex: 1; }
  .acctbtn { display: none; align-items: center; gap: 10px; width: 100%; background: #fff; border: 0; border-radius: 18px; padding: 10px; cursor: pointer; text-align: left; box-shadow: var(--shadow); }
  .acctbtn .who1 { flex: 1; min-width: 0; line-height: 1.3; }
  .acctbtn .who1 b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acctbtn .who1 span { font-size: 12.5px; color: var(--ink2); }
  .av { width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: var(--sun); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; border: 0; cursor: pointer; }
  .acctbtn .more { color: var(--ink2); }
  .content { min-width: 0; padding: 30px 32px 48px 16px; }
  main { max-width: 940px; }
  nav.bottom { display: none; }
  body.out .layout { display: block; max-width: 980px; }
  body.out aside.sidebar, body.out nav.bottom { display: none !important; }
  body.out .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }

  
/* ---------- page parts ---------- */
  .ph { position: relative; margin-bottom: 20px; }
  .pagehero { position: relative; overflow: hidden; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 22px 22px 18px; border-radius: 28px;
    background: linear-gradient(135deg, rgba(0,153,255,.16) 0%, rgba(124,203,255,.22) 48%, rgba(255,221,0,.18) 100%); border: 1px solid rgba(18,32,58,.08); box-shadow: var(--shadow); }
  .ph:not(.home) .pagehero { padding: 16px 20px; }
  .pagehero::before, .pagehero::after { content: ""; position: absolute; border-radius: 999px; pointer-events: none; }
  .pagehero::before { width: 140px; height: 140px; right: -34px; top: -46px; background: radial-gradient(circle, rgba(255,221,0,.65) 0%, rgba(255,221,0,.10) 55%, rgba(255,221,0,0) 72%); }
  .pagehero::after { width: 180px; height: 180px; left: -84px; bottom: -96px; background: radial-gradient(circle, rgba(0,153,255,.18) 0%, rgba(0,153,255,.05) 58%, rgba(0,153,255,0) 72%); }
  .ph .grow { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .ph h1 { font-size: 28px; line-height: 1.12; margin: 0; font-weight: 800; letter-spacing: -.5px; }
  .ph p { margin: 6px 0 0; color: var(--ink2); }
  .herokicker { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--navy); margin-bottom:8px; }
  .herokicker .sparkpill { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:999px; background:#fff; box-shadow:0 6px 18px rgba(18,32,58,.10); color:var(--blue); }
  .ph p.herosub { margin-top: 8px; max-width: 44ch; font-size: 14.5px; line-height: 1.45; }
  .card { background: #fff; border-radius: var(--r); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card > h2, .sech { display: flex; align-items: baseline; justify-content: space-between; font-size: 17px; font-weight: 700; margin: 0 0 12px; }
  .sech { margin: 6px 4px 12px; }
  .sech a, .card > h2 a { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid2 > * { min-width: 0; }

  /* week strip */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 0 0 20px; }
  .wd { text-align: center; font-size: 12px; color: var(--ink2); }
  .wd i { display: grid; place-items: center; margin: 6px auto 0; width: 42px; height: 42px; border-radius: 50%; background: #fff; font-style: normal; font-weight: 600; font-size: 15px; color: var(--navy); box-shadow: var(--shadow); }
  .wd.today i { box-shadow: inset 0 0 0 2px var(--navy); }
  .wd.due i { background: var(--sun); box-shadow: none; }
  .wd.done i { background: var(--navy); color: var(--sun); }

  /* the big check-in card */
  .heroc { position: relative; overflow: hidden; border-radius: 28px; padding: 26px 26px 24px; margin-bottom: 18px; background: var(--sun); min-height: 190px; }
  .heroc.done { background: var(--sky); }
  .heroc.late { background: var(--sun-l); }
  .heroc h3 { position: relative; font-size: 22px; line-height: 1.25; margin: 0 0 6px; max-width: 70%; font-weight: 700; }
  .heroc p { position: relative; margin: 0 0 18px; max-width: 62%; color: var(--navy2); }
  .heroc .art { position: absolute; right: -10px; bottom: -20px; width: 210px; height: 210px; }
  .heroc .art i { position: absolute; border-radius: 50%; }
  .heroc .art .a1 { width: 170px; height: 170px; right: 0; bottom: 0; background: rgba(255,255,255,.35); }
  .heroc .art .a2 { width: 96px; height: 96px; right: 40px; bottom: 44px; background: #fff; display: grid; place-items: center; font-style: normal; font-size: 46px; }
  .heroc.done .art .a1 { background: rgba(255,255,255,.55); }
  .pillbtn { position: relative; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 13px 24px; background: var(--navy); color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .pillbtn:hover { background: var(--navy2); }
  .pillbtn.light { background: #fff; color: var(--navy); }
  .pillbtn.sun { background: var(--sun); color: var(--navy); }
  .pillbtn[disabled] { background: var(--s-bg); color: #9AA6B8; cursor: default; }
  .pillbtn.sm { padding: 8px 16px; font-size: 13px; }

  /* small tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .tile { border-radius: 22px; padding: 16px 18px; background: #fff; box-shadow: var(--shadow); min-width: 0; }
  .tile .l { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
  .tile .v { font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: 6px; overflow-wrap: anywhere; }
  .tile .v small { font-size: 13px; font-weight: 600; color: var(--ink2); }
  .tile.navy { background: var(--navy); color: #fff; } .tile.navy .l, .tile.navy .v small { color: #B9C6DC; } .tile.navy .v { color: var(--sun); }
  .tile.sky { background: var(--sky); } .tile.sunl { background: var(--sun-l); }
  .tile .v.txt { font-size: 17px; }

  /* events: rounded cards that scroll sideways */
  .evrow { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; }
  .evc { flex: 0 0 240px; scroll-snap-align: start; border-radius: 22px; padding: 16px; background: var(--sky); display: flex; flex-direction: column; gap: 4px; }
  .evc:nth-child(2n) { background: var(--sun-l); }
  .evc .date { align-self: flex-start; background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .evc .t { font-weight: 700; line-height: 1.3; }
  .evc .muted { font-size: 12.5px; }
  .evc .gadd { margin-top: auto; padding-top: 10px; font-size: 12.5px; }
  .evlist .evc { flex: none; margin-bottom: 12px; }
  .cals { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; padding-top: 0; }
  .when { flex: 0 0 100px; font-size: 13px; color: var(--ink2); }
  .bubble { width: 38px; height: 38px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 19px; flex: none; }

  /* bars (rounded, like a mood chart) */
  .bars { display: flex; gap: 12px; align-items: flex-end; height: 200px; padding-top: 6px; overflow-x: auto; }
  .bar { flex: 1 0 54px; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  .bar .track { flex: 1; width: 100%; max-width: 64px; background: var(--bg); border-radius: 999px; position: relative; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: var(--blue); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
               color: #fff; font-size: 12px; font-weight: 700; min-height: 34px; }
  .bar:nth-child(3n+2) .fill { background: var(--sun); color: var(--navy); }
  .bar:nth-child(3n) .fill { background: var(--navy); }
  .bar .nm { font-size: 11.5px; color: var(--ink2); text-align: center; line-height: 1.2; max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bignum { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .bignum small { font-size: 18px; color: var(--ink2); font-weight: 600; letter-spacing: 0; }

  ul.list.todo li { display: block; padding: 12px 14px; border: 0; border-radius: 16px; background: var(--bg); margin-bottom: 10px; font-size: 14px; }
  .todo li.t-red { background: var(--r-bg); } .todo li.t-yellow { background: var(--sun-l); } .todo li.t-green { background: var(--g-bg); }
  .copybox { margin: 8px 0; background: #fff; border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 13px; }
  .tablebox { border-radius: 18px; overflow: hidden; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--ink2); font-weight: 600; padding: 10px 12px; background: var(--soft); }
  td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { font-weight: 600; }
  tr.me td:first-child { box-shadow: inset 4px 0 0 var(--sun); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .p-red { background: var(--r-bg); color: var(--r-fg); } .p-yellow { background: var(--y-bg); color: var(--y-fg); }
  .p-green { background: var(--g-bg); color: var(--g-fg); } .p-grey { background: var(--s-bg); color: var(--s-fg); }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .pick button { border: 0; background: #fff; border-radius: 999px; padding: 7px 16px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); }
  .pick button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .loading { padding: 60px 0; color: var(--ink2); }

  /* ---------- the check-in: one question at a time ---------- */
  .lesson { position: fixed; inset: 0; z-index: 90; overflow: auto; background: var(--bg); display: flex; justify-content: center; }
  .lesson .lcard { width: 100%; max-width: 600px; display: flex; flex-direction: column; min-height: 100%; padding: 0 20px; }
  .lesson .lt { display: flex; align-items: center; gap: 14px; padding: max(22px, env(safe-area-inset-top)) 0 0; }
  .lesson .x { background: #fff; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; flex: none; box-shadow: var(--shadow); }
  .prog { flex: 1; height: 12px; background: #fff; border-radius: 999px; overflow: hidden; box-shadow: var(--shadow); }
  .prog i { display: block; height: 100%; background: var(--sun); border-radius: 999px; transition: width .3s; }
  #ckh { padding: 28px 4px 0; }
  .lesson .kicker { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .lesson h2 { font-size: 26px; line-height: 1.25; font-weight: 700; margin: 6px 0 0; letter-spacing: -.2px; }
  .lesson .lq { flex: 1; padding: 20px 0 10px; }
  .choices { display: grid; gap: 12px; }
  .choice { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: #fff; border: 0; border-radius: 22px; padding: 12px 16px 12px 12px; font-size: 15.5px; font-weight: 600;
            cursor: pointer; box-shadow: var(--shadow); }
  .choice .em { width: 46px; height: 46px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 23px; flex: none; }
  .choice .box2 { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C5D0DF; margin-left: auto; flex: none; display: grid; place-items: center; font-size: 13px; color: transparent; }
  .choice[aria-pressed="true"] { background: var(--sun); }
  .choice[aria-pressed="true"] .em { background: #fff; }
  .choice[aria-pressed="true"] .box2 { background: var(--navy); border-color: var(--navy); color: var(--sun); }
  .choice.consent { padding: 16px; font-weight: 500; font-size: 14px; line-height: 1.5; }
  textarea.ta { width: 100%; min-height: 160px; font: inherit; font-size: 15px; padding: 16px 18px; border: 0; border-radius: 22px; outline: none; color: var(--navy); resize: vertical; box-shadow: var(--shadow); }
  textarea.ta:focus { box-shadow: 0 0 0 3px var(--sun), var(--shadow); }
  .privacy { font-size: 12px; color: var(--ink2); margin-top: 14px; line-height: 1.5; }
  .lesson .lf { padding: 12px 0 max(24px, env(safe-area-inset-bottom)); display: flex; gap: 10px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg); }
  .lesson .lf .msg { flex: 1 1 100%; font-weight: 600; font-size: 13px; color: var(--r-fg); text-align: center; }
  .lesson .lf .msg:empty { display: none; }
  .lesson .lf .pillbtn { flex: 1; justify-content: center; padding: 16px; font-size: 15px; }
  .lesson .lf #ckgo { background: var(--sun); color: var(--navy); flex: 2; }
  .lesson .lf #ckgo[disabled] { background: #E6EBF2; color: #9AA6B8; }
  .lesson .lf #ckback { background: #fff; color: var(--navy); }
  .lesson .lf.solo { justify-content: center; } .lesson .lf.solo #ckgo { flex: 0 1 360px; }
  .win { text-align: center; padding: 40px 0 0; }
  .win .bignum { font-size: 72px; }
  .win h2 { margin-top: 12px !important; }
  .win p { margin: 8px 0 0; color: var(--ink2); }

  /* ---------- personality: sparkles, tile icons, gentle motion ---------- */
  .hello { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 2px; }
  .heroc .sp { position: absolute; color: var(--navy); }
  .heroc .sp1 { right: 190px; top: 22px; } .heroc .sp2 { right: 34px; top: 26px; opacity: .8; }
  .heroc .sp svg.ico .f { fill: #fff; }
  .heroc.done .sp svg.ico .f { fill: var(--sun); }
  .heroc .wm { position: absolute; left: -30px; bottom: -46px; opacity: .08; transform: rotate(-12deg); pointer-events: none; }
  .tile { position: relative; }
  .tile { padding-right: 62px; }
  .tile .ti { position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.75); }
  .tile.navy .ti { background: rgba(255,255,255,.1); }
  .tile .note2 { font-size: 12px; margin-top: 2px; color: var(--ink2); }
  .tile.navy .note2 { color: #B9C6DC; }
  .evc { position: relative; overflow: hidden; }
  .evc::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,.45); }
  .evc > * { position: relative; z-index: 1; }
  .card, .tile, .evc, .heroc { transition: transform .18s ease, box-shadow .18s ease; }
  .tile:hover, .evc:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(18,32,58,.10); }
  .helpcard { margin: 0 2px 14px; border-radius: 20px; padding: 14px 14px 12px; background: var(--sky); position: relative; overflow: hidden; }
  .helpcard b { display: block; font-size: 13.5px; }
  .helpcard span { display: block; font-size: 12px; color: var(--navy2); margin: 2px 0 10px; }
  .helpcard .sp { position: absolute; right: 10px; top: 10px; color: var(--navy); }
  .choices .choice:nth-child(4n+1) .em { background: var(--sun-l); } .choices .choice:nth-child(4n+2) .em { background: var(--sky); }
  .choices .choice:nth-child(4n+3) .em { background: #E8E4FF; } .choices .choice:nth-child(4n+4) .em { background: var(--r-bg); }
  .choice { transition: transform .12s ease, background .15s ease; } .choice:active { transform: scale(.98); }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 95; }
  .confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 3px; animation: fall 2.4s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
  main > * { animation: rise .45s ease both; }
  main > *:nth-child(2) { animation-delay: .04s; } main > *:nth-child(3) { animation-delay: .08s; } main > *:nth-child(4) { animation-delay: .12s; }
  main > *:nth-child(5) { animation-delay: .16s; } main > *:nth-child(n+6) { animation-delay: .2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .authart { margin-top: 26px; border-radius: 24px; background: var(--sun); height: 150px; position: relative; overflow: hidden; }

// Email-first flow: email -> password OR code -> newpass OR join -> pending/approved; reset via Forgot password.
function go(step) {
  if (step === 'password') step = 'signin';
  AUTH.step = step;
  var email = $('em').value.trim(), reset = AUTH.purpose === 'reset';
  document.querySelector('.auth').classList.toggle('register', step === 'join');
  var show = { signin: ['email', 'password'] }[step] || [step];
  ['choose', 'email', 'password', 'code', 'newpass', 'join', 'joined'].forEach(function (p) { $('p-' + p).style.display = show.indexOf(p) !== -1 ? '' : 'none'; });
  $('joinbox').style.display = 'none';
  $('emhint').textContent = reset
    ? 'Enter your email to request a password-reset code.'
    : 'Enter your email to sign in or register.';
  $('emhint').style.display = step === 'signin' ? 'none' : '';
  $('p-password').style.marginTop = step === 'signin' ? '16px' : '';
  if ($('tosignin')) $('tosignin').onclick = function () { AUTH.mode = 'signin'; go('signin'); };
  var T = {
    choose:   ['Welcome to START', 'Sign in, or create your account if this is your first time.', '', null],
    signin:   ['Welcome back', 'Enter your password to continue to START ' + REGION, 'Forgot password?', function () { if (!$('em').value.trim()) { say('Enter your email first'); return; } AUTH.mode = 'reset'; AUTH.purpose = 'reset'; begin('reset'); }],
    email:    reset ? ['Reset password', 'Enter your email to request a new verification code.', 'Back', function () { AUTH.purpose = 'new'; go('email'); }]
                    : ['Welcome to START', 'Enter your email to continue.', '', null],
    code:     [reset ? 'Reset password' : 'Verify your email', 'Enter the code sent to ' + email + '.', 'Use another email', function () { go('email'); }],
    newpass:  [reset ? 'Set a new password' : 'Set up your password', 'Enter a new password and confirm it. You’ll enter START automatically.', '', null],
    join:     ['Register for START', 'A few details help us find your scholar record.', 'Back', function () { go('email'); }],
    joined:   [AUTH.sorry ? 'Thank you!' : 'Request received', '', 'Use another email', function () { AUTH.purpose = 'new'; go('email'); }],
  }[step];
  $('next').textContent = { join: 'Continue with registration', joined: 'Use another email', signin: 'Sign in', email: reset ? 'Send reset code' : 'Continue', newpass: reset ? 'Save password' : 'Create password' }[step] || 'Next';
  $('next').style.display = step === 'choose' ? 'none' : '';
  $('h').textContent = T[0]; $('lede').textContent = T[1];
  $('alt').textContent = T[2]; $('alt').style.visibility = T[2] ? 'visible' : 'hidden'; $('alt').onclick = T[3];
  $('who').style.display = ['choose', 'email', 'signin'].indexOf(step) !== -1 ? 'none' : 'inline-flex';
  $('whoe').textContent = email; $('av').textContent = email.charAt(0).toUpperCase();
  say('');
  if (step === 'join') renderJoinStage();
  var focus = { email: 'em', signin: email ? 'pw' : 'em', code: 'cd', newpass: 'np', join: 'jln' }[step];
  if (step !== 'email' && step !== 'signin') ['pw', 'cd', 'np', 'np2'].forEach(function (id) { $(id).value = ''; });
  setTimeout(function () { try { $(focus).focus(); } catch (e) {} }, 30);
}
// Errors under the box, like Google's
function say(t, ok) {
  [].forEach.call(document.querySelectorAll('.auth .field.bad'), function (f) {
    f.classList.remove('bad'); var c = f.querySelector('input,select'); if (c) c.removeAttribute('aria-invalid');
    var msg = f.querySelector('.field-error'); if (msg) msg.textContent = '';
  });
  var e = $('err'); if (!e) return;
  e.classList.remove('on'); $('authstatus').textContent = '';
  if (!t) return;
  if (ok) { $('authstatus').textContent = t; return; }
  var id = AUTH.bad; AUTH.bad = null;
  if (id && $(id)) {
    var f = $(id), control = f.querySelector('input,select');
    f.classList.add('bad'); f.querySelector('.field-error').textContent = t;
    if (control) { control.setAttribute('aria-invalid', 'true'); control.focus(); }
    return;
  }
  $('errt').textContent = t; e.classList.add('on');
}
function busy(on) { $('next').disabled = on; }
// "This is my own device": unticked on a shared or lab computer = signed out after 12 hours
function keepMe() { var b = document.querySelector('#p-' + AUTH.step + ' .keepme'); return !b || b.checked; }
function next() {
  if (AUTH.step === 'email') return begin(AUTH.mode === 'reset' ? 'reset' : '');
  if (AUTH.step === 'signin') return password();
  if (AUTH.step === 'code') return code();
  if (AUTH.step === 'newpass') return newPassword();
  if (AUTH.step === 'join') return joinNext();
  if (AUTH.step === 'joined') { AUTH.mode = 'create'; AUTH.purpose = 'new'; return go('email'); }
}
// Not on the list yet: ask to join (the RR adds them, they get a "You're in" email)
function joinOpen() {
  AUTH.joinFrom = 'email'; AUTH.sorry = false; AUTH.joinStage = 0;
  go('join');
  if ($('js').options.length > 1) return;
  $('js').options[0].textContent = 'Loading schools…';
  $('jp').options[0].textContent = 'Loading programs…';
  call('webJoinSchools').then(function (r) {
    if (!r || !r.ok) { say((r && r.msg) || 'Could not load the form choices. Try again.'); return; }
    var opt = function (v, t) { return '<option value="' + esc(v) + '">' + esc(t == null ? v : t) + '</option>'; };
    $('js').innerHTML = '<option value="">Choose your school</option>' + r.schools.map(function (x) { return typeof x === 'string' ? opt(x) : opt(x.name, x.label); }).join('');
    $('jp').innerHTML = '<option value="">Choose your degree program</option>' +
      '<optgroup label="START-DOST eligible programs (13)">' + (r.programs || []).map(function (p) { return opt(p); }).join('') + '</optgroup>';
    $('jy').innerHTML = '<option value="">Choose</option>' + (r.years || []).map(function (p) { return opt(p); }).join('');
    $('jc').innerHTML = '<option value="">Choose your scholarship</option>' + (r.kinds || []).map(function (p) { return opt(p); }).join('');
    $('jya').innerHTML = '<option value="">Choose</option>' + (r.awarded || []).map(function (p) { return opt(p); }).join('');
    JOIN_PLACES = r.places || {};
    $('jprov').innerHTML = '<option value="">Choose your province</option>' + Object.keys(JOIN_PLACES).sort().map(function (p) { return opt(p); }).join('');
    $('jprov').onchange = function () {
      var list = JOIN_PLACES[$('jprov').value] || [];
      $('jcity').disabled = !list.length;
      $('jcity').innerHTML = '<option value="">' + (list.length ? 'Choose your city or municipality' : 'Choose your province first') + '</option>' + list.map(function (c) { return opt(c); }).join('');
    };
  }).catch(function () { say('Could not load the join form choices. Check your connection, then go back and try again.'); });
}
var JOIN_PLACES = {};
var JOIN_STAGES = ['Your name', 'School and program', 'Scholarship and hometown'];
function renderJoinStage() {
  var stage = AUTH.joinStage;
  [].forEach.call(document.querySelectorAll('[data-join-step]'), function (section) { section.hidden = Number(section.getAttribute('data-join-step')) !== stage; });
  $('joincount').textContent = 'Step ' + (stage + 1) + ' of 3';
  $('joinlabel').textContent = JOIN_STAGES[stage];
  $('joinprogress').style.setProperty('--join-progress', ((stage + 1) * 100 / 3) + '%');
  $('next').textContent = stage === 2 ? 'Submit registration' : 'Continue';
  $('alt').textContent = 'Back'; $('alt').style.visibility = 'visible';
  $('alt').onclick = function () {
    if (AUTH.joinStage > 0) {
      AUTH.joinStage--; say(''); renderJoinStage();
      var first = document.querySelector('[data-join-step="' + AUTH.joinStage + '"] input, [data-join-step="' + AUTH.joinStage + '"] select');
      if (first) first.focus();
    } else go('email');
  };
}
function joinValidate(stage) {
  var value = function (id) { return $(id).value.trim(); };
  var rules = [
    [['jln', value('jln').length >= 2, 'Enter your last name'], ['jfn', value('jfn').length >= 2, 'Enter your first name']],
    [['js', !!value('js'), 'Choose your school'], ['jp', !!value('jp'), 'Choose your degree program'], ['jy', !!value('jy'), 'Choose your year level']],
    [['jya', !!value('jya'), 'Choose the year awarded'], ['jc', !!value('jc'), 'Choose your DOST scholarship'],
      ['jprov', !!value('jprov'), 'Choose your province'], ['jcity', !!value('jcity'), 'Choose your city or municipality']]
  ];
  var invalid = rules[stage].filter(function (r) { return !r[1]; })[0];
  if (invalid) { AUTH.bad = 'f-' + invalid[0]; say(invalid[2]); return false; }
  return true;
}
function joinNext() {
  if (AUTH.joinStage === 1 && $('js').options.length <= 1) {
    say('School and program choices are still loading. Please wait a moment.'); return;
  }
  if (!joinValidate(AUTH.joinStage)) return;
  if (AUTH.joinStage < 2) {
    AUTH.joinStage++; say(''); renderJoinStage();
    var first = document.querySelector('[data-join-step="' + AUTH.joinStage + '"] input, [data-join-step="' + AUTH.joinStage + '"] select');
    if (first) first.focus();
    return;
  }
  joinSend();
}
function joinSend() {
  var v = function (id) { return ($(id) ? $(id).value : '').trim(); };
  for (var stage = 0; stage < 3; stage++) {
    AUTH.joinStage = stage; renderJoinStage();
    if (!joinValidate(stage)) return;
  }
  AUTH.joinStage = 2; renderJoinStage();
  var name = v('jln') + ', ' + v('jfn') + (v('jmi') ? ' ' + v('jmi').replace(/\.$/, '') + '.' : '');
  say('');
  busy(true);
  call('webJoinRequest', S.email || $('em').value.trim(), name, v('js'), '',
       { last: v('jln'), first: v('jfn'), mi: v('jmi'), program: v('jp'), year: v('jy'), awarded: v('jya'), kind: v('jc'), city: v('jcity'), province: v('jprov') }).then(function (r) {
    busy(false);
    if (!r || !r.ok) { say((r && r.msg) || 'Could not send. Try again.'); return; }
    if (r.onList || r.auto) { AUTH.mode = 'create'; AUTH.purpose = 'new'; return begin(''); }   // on the list now: straight to the code
    AUTH.sorry = !!r.sorry; go('joined');
    $('joinedt').innerHTML = r.sorry ? '<span class="sorry">' + esc(r.msg).replace('Thank you for your interest in START!', '<b>Thank you for your interest in START!</b><br>') + '</span>' : esc(r.msg);
  }).catch(function () { busy(false); say('Could not reach START. Try again.'); });
}
function begin(purpose, again) {
  var email = $('em').value.trim();
  if (!/\S+@\S+\.\S+/.test(email)) { go('email'); AUTH.bad = 'f-em'; say('Enter a valid email address'); return; }
  busy(true); say('');
  call('webStart', email, purpose || '').then(function (r) {
    busy(false);
    if (!r || !r.ok) { say((r && r.msg) || 'Something went wrong. Try again.'); return; }
    S.email = email; keep('start_email', email);
    AUTH.purpose = r.purpose || 'new';
    if (r.mode === 'password') { AUTH.mode = 'signin'; go('signin'); return; }
    if (r.mode === 'join') { AUTH.purpose = 'new'; AUTH.mode = 'create'; joinOpen(); say((r.note || 'This email isn\'t on the START list yet. Fill this in once to join.') + ' Use the name on your DOST scholarship.', true); return; }
    if (r.mode === 'joined') { AUTH.sorry = !!r.sorry; go('joined'); $('joinedt').innerHTML = r.sorry ? '<span class="sorry">' + esc(r.msg) + '</span>' : esc(r.msg); return; }
    go('code');
    var where = r.to ? 'your main START email, ' + r.to : email;
    if (r.recent) say('A code was sent to ' + where + ' less than a minute ago. Give it a minute, and check Spam and Promotions.', true);
    else say((again ? 'A new code is on its way to ' : 'We emailed a 6-digit code to ') + where + '. It can take a minute. Check Spam and Promotions too.', true);
  }).catch(function () { busy(false); say('Could not reach START. Try again.'); });
}
function password() {
  var pw = $('pw').value;
  if (!pw) { AUTH.bad = 'f-pw'; say('Enter your password'); return; }
  var em = $('em').value.trim();
  if (!/\S+@\S+\.\S+/.test(em)) { AUTH.bad = 'f-em'; say('Enter a valid email address'); return; }
  busy(true);
  S.email = em; keep('start_email', em);
  call('webPasswordSignIn', em, pw, keepMe()).then(function (r) {
    busy(false);

  }).catch(function () { busy(false); say('Could not reach START. Try again.'); });
}
function code() {

    busy(false);

function newPassword() {

            (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ', ' + p2[0] + ' ' + p2[1];
